name: 매일 갱신

on:
  schedule:
    - cron: "37 19 * * *"   # 매일 04:37 (한국 시간)
  workflow_dispatch:         # Actions 화면에서 직접 돌리기

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyproj

      - name: 받기·판정·내보내기
        env:
          TZ: Asia/Seoul
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          NAVER_API_KEY_ID: ${{ secrets.NAVER_API_KEY_ID }}
          NAVER_API_KEY: ${{ secrets.NAVER_API_KEY }}
          NEWSHOP_BASE: ${{ github.workspace }}
          NEWSHOP_KEY_FILE: /dev/null
          NEWSHOP_DATA: ${{ github.workspace }}/data
          NEWSHOP_MAP_DIR: map
        run: python scripts/매일갱신.py

      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "바뀐 자료 없음"
          else
            git commit -m "자료 갱신 $(TZ=Asia/Seoul date +%F)"
            git push
          fi
