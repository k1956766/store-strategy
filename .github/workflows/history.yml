name: 분석용 이력 받기

# 상권 동향 분석 1단계: 시도 단위로 개업·폐업 이력을 받아 history/에 저장한다.
# 손으로 돌린다(Actions → 분석용 이력 받기 → Run workflow). 시간 안에 못 끝내면 다시 돌리면 이어 받는다.
on:
  workflow_dispatch:
    inputs:
      sido:
        description: "시도(지자체_수도권.json 이름 앞부분: 서울, 경기, 인천)"
        default: "서울"
      start:
        description: "폐업 기준일(YYYY-MM-DD)"
        default: "2025-01-01"
      group:
        description: "업종 묶음(음식, 확장, 전체)"
        default: "음식"

permissions:
  contents: write

concurrency:
  group: daily-update        # 매일 갱신과 동시에 커밋하지 않도록 같은 묶음으로
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 이력 받기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          HIST_SIDO: ${{ inputs.sido }}
          HIST_START: ${{ inputs.start }}
          HIST_GROUP: ${{ inputs.group }}
          HIST_BUDGET_MIN: "290"
        run: python -u scripts/이력받기.py
      - name: 집계(이력을 다 받았을 때만)
        env:
          HIST_SIDO: ${{ inputs.sido }}
          HIST_START: ${{ inputs.start }}
          HIST_GROUP: 전체
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: |
          pip install -q pyproj shapely
          if python -u scripts/이력받기.py --check 2>/dev/null | grep -q "남은 묶음 0개"; then python -u scripts/집계.py && python -u scripts/지표.py; else echo "아직 받을 이력이 남아 집계는 건너뜀"; fi
      - name: 결과 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add history analysis data/좌표_캐시.json data/trend
          if git diff --cached --quiet; then echo "새 이력 없음"; exit 0; fi
          git commit -m "분석용 이력: ${{ inputs.sido }} ${{ inputs.group }} (폐업 ${{ inputs.start }} 이후)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 10; done
