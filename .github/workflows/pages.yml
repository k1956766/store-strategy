name: 홈페이지 배포

# 홈페이지 파일과 지도 자료만 골라 GitHub Pages에 올린다. 브이월드 키는 이때 넣는다(저장소 코드에는 없음).
on:
  push:
    branches: [main]
  workflow_run:                # 매일 갱신이 자료를 커밋한 뒤에도 배포
    workflows: ["매일 갱신"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 배포할 파일 모으기, 브이월드 키 넣기
        env:
          K: ${{ secrets.VWORLD_KEY }}
        run: |
          mkdir -p _site/data
          cp index.html app.js style.css trend.html trend.js trend.css _site/
          cp -r lib _site/
          cp -r data/map data/sigungu_base.json data/trend data/boundary_web _site/data/
          K=$(printf '%s' "$K" | tr -d '[:space:]')
          sed -i -E "s/const VW_KEY = '[^']*'/const VW_KEY = '${K}'/" _site/app.js _site/trend.js
          du -sh _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: dep
        uses: actions/deploy-pages@v4
