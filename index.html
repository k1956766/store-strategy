<style>
/* 지도 왼쪽(또는 위)에 조건·요약·목록 패널, 오른쪽에 지도. 색은 업종 묶음 7개 + 기타 회색만. */
:root {
  --bg: #eef1f4;
  --panel: #ffffff;
  --ink: #16202b;
  --muted: #5b6876;
  --line: #dde3e9;
  --soft: #f3f5f8;
  --focus: #2a78d6;
  --g1: #2a78d6; --g2: #eb6834; --g3: #1baf7a; --g4: #eda100;
  --g5: #e87ba4; --g6: #008300; --g7: #6250d6; --g0: #8a949e;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171d; --panel: #1a2027; --ink: #e9edf1; --muted: #9ba7b3; --line: #2c343d; --soft: #222a33;
    --focus: #6da7ec;
    --g1: #3987e5; --g2: #d95926; --g3: #199e70; --g4: #c98500; --g5: #d55181; --g6: #2f9b2f; --g7: #9085e9; --g0: #7b8590;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171d; --panel: #1a2027; --ink: #e9edf1; --muted: #9ba7b3; --line: #2c343d; --soft: #222a33;
  --focus: #6da7ec;
  --g1: #3987e5; --g2: #d95926; --g3: #199e70; --g4: #c98500; --g5: #d55181; --g6: #2f9b2f; --g7: #9085e9; --g0: #7b8590;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 360px 1fr; height: 100%; }
.panel { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.panel-top { padding: 18px 18px 12px; display: grid; gap: 14px; border-bottom: 1px solid var(--line); }
h1 { font-size: 20px; line-height: 1.25; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--muted); font-size: 12.5px; margin: 2px 0 0; }
.row { display: grid; gap: 6px; }
.label { font-size: 12px; color: var(--muted); font-weight: 500; }
select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--soft); padding: 7px 0; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px 4px 7px; border: 1px solid var(--line);
  border-radius: 999px; background: var(--panel); cursor: pointer; font-size: 12.5px; }
.chip .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="false"] { opacity: .45; }
.chip[aria-pressed="false"] .dot { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--g0); }
.summary { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.summary b { font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.summary span { color: var(--muted); font-size: 13px; }

.list-head { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 18px 6px; font-size: 12px; color: var(--muted); }
.list { list-style: none; margin: 0; padding: 0 8px 12px; overflow-y: auto; flex: 1; min-height: 0; }
.list li { display: grid; grid-template-columns: 10px 1fr auto; gap: 4px 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.list li:hover, .list li:focus-visible { background: var(--soft); }
.list .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; }
.list .nm { font-weight: 500; overflow-wrap: anywhere; }
.list .dt { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.list .meta { grid-column: 2 / 4; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.empty { padding: 16px 18px; color: var(--muted); }
.foot { padding: 10px 18px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11.5px; line-height: 1.55; }
.foot a { color: inherit; }

.mapwrap { position: relative; min-height: 0; }
#map { position: absolute; inset: 0; background: var(--bg); }
.loading { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 500; background: var(--panel);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.loading[hidden] { display: none; }

.leaflet-container { font: 13px/1.45 var(--font); background: var(--bg); }
.leaflet-tile-pane { filter: grayscale(.85) contrast(.9) brightness(1.04); opacity: .85; }
:root[data-theme="dark"] .leaflet-tile-pane { filter: grayscale(1) invert(1) brightness(.85) contrast(.9); opacity: .7; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .leaflet-tile-pane { filter: grayscale(1) invert(1) brightness(.85) contrast(.9); opacity: .7; } }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--ink); }
.leaflet-popup-content { margin: 12px 14px; min-width: 200px; }
.pp-name { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
.pp-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; margin-bottom: 6px; }
.pp-tag .dot { width: 9px; height: 9px; border-radius: 50%; }
.pp dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; font-size: 12.5px; }
.pp dt { color: var(--muted); }
.pp dd { margin: 0; }
.pp a { color: var(--focus); }
.shop-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
.cl { display: grid; place-items: center; border-radius: 50%; color: #fff; font-weight: 700; font-variant-numeric: tabular-nums;
  background: var(--ink); border: 3px solid var(--panel); box-shadow: 0 1px 4px rgba(0,0,0,.3); }
:root[data-theme="dark"] .cl { color: #12171d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cl { color: #12171d; } }
.leaflet-control-attribution { background: var(--panel) !important; color: var(--muted); }
.leaflet-control-attribution a { color: var(--muted); }
.leaflet-bar a { background: var(--panel); color: var(--ink); border-color: var(--line); }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 52% 48%; }
  .mapwrap { grid-row: 1; }
  .panel { grid-row: 2; border-right: 0; border-top: 1px solid var(--line); overflow-y: auto; }
  .list { overflow: visible; }
  .panel-top { padding: 12px 16px 10px; gap: 10px; }
  h1 { font-size: 17px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <div class="panel-top">
      <div>
        <h1>새로 생긴 가게 지도</h1>
        <p class="sub" id="updated">영업 신고·허가 공공데이터 · 수도권</p>
      </div>
      <div class="row">
        <label class="label" for="region">지역</label>
        <select id="region"></select>
      </div>
      <div class="row">
        <span class="label" id="period-label">인허가 기간</span>
        <div class="seg" role="group" aria-labelledby="period-label">
          <button type="button" id="p14" data-days="14" aria-pressed="false">최근 2주</button>
          <button type="button" id="p30" data-days="30" aria-pressed="true">1개월</button>
          <button type="button" id="p90" data-days="90" aria-pressed="false">3개월</button>
        </div>
      </div>
      <div class="row">
        <span class="label" id="cat-label">업종 (눌러서 켜고 끄기)</span>
        <div class="chips" id="chips" role="group" aria-labelledby="cat-label"></div>
      </div>
      <div class="summary"><b id="total">–</b><span id="total-sub">곳</span></div>
    </div>
    <div class="list-head"><span id="list-title">지도에 보이는 가게 · 최신순</span><span id="list-count"></span></div>
    <ul class="list" id="list"></ul>
    <div class="foot">
      인허가일 기준이라 실제 개업일과 며칠~몇 주 다를 수 있고, 지자체 자료가 공공데이터에 올라오기까지 2~5일 걸린다.
      폐업·한시적 영업·행사장 임시 영업은 뺐다. 업종은 신고 업태와 상호, 카카오·네이버 지도 등록 정보로 정했다.<br>
      출처: 행정안전부 지방행정 인허가 데이터(공공데이터포털), 공정거래위원회 가맹사업 정보, 카카오·네이버 지도
    </div>
  </aside>
  <div class="mapwrap">
    <div id="map" role="region" aria-label="가게 지도"></div>
    <div class="loading" id="loading">자료를 불러오는 중…</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script>
(function () {
  // 업종 15개를 색 묶음 7개 + 기타로 (색은 고정 순서, 필터로 바뀌지 않는다)
  var GROUPS = [
    { key: "g1", name: "한식", cats: ["한식", "고기구이", "해산물·횟집"] },
    { key: "g2", name: "카페·디저트", cats: ["카페·음료", "디저트·베이커리"] },
    { key: "g3", name: "일식·중식·아시아", cats: ["일식", "중식", "아시아 음식"] },
    { key: "g4", name: "분식·치킨·버거", cats: ["분식", "치킨·버거·피자"] },
    { key: "g5", name: "양식", cats: ["양식"] },
    { key: "g6", name: "편의점·오락", cats: ["편의점", "PC방·오락"] },
    { key: "g7", name: "술집", cats: ["술집"] },
    { key: "g0", name: "기타", cats: ["기타"] }
  ];
  var CAT2G = {};
  GROUPS.forEach(function (g) { g.cats.forEach(function (c) { CAT2G[c] = g.key; }); });
  function groupOf(cat) { return CAT2G[cat] || "g0"; }
  function color(key) { return getComputedStyle(document.documentElement).getPropertyValue("--" + key).trim(); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  var SIDO = { seoul: "서울", gyeonggi: "경기", incheon: "인천" }, SIDO_KEY = { "서울": "seoul", "경기": "gyeonggi", "인천": "incheon" };
  var state = { region: "all", days: 30, off: {} };
  var index = null, cache = {}, current = [], refDate = null;
  var $ = function (id) { return document.getElementById(id); };

  // ---- 지도 ----
  var map = L.map("map", { zoomControl: true, preferCanvas: false }).setView([37.45, 127.0], 10);
  function isDark() {
    var t = document.documentElement.getAttribute("data-theme");
    return t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  var tiles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 기여자'
  }).addTo(map);
  var base = L.layerGroup().addTo(map);
  fetch("data/sigungu_base.json").then(function (r) { return r.json(); }).then(function (g) {
    L.geoJSON(g, { interactive: false, style: function () {
      return { color: getComputedStyle(document.documentElement).getPropertyValue("--muted").trim(), weight: 1, opacity: .55, fillOpacity: 0 };
    } }).addTo(base);
  }).catch(function () {});

  var cluster = L.markerClusterGroup({
    showCoverageOnHover: false, maxClusterRadius: 48, spiderfyOnMaxZoom: true, disableClusteringAtZoom: 17, chunkedLoading: true,
    iconCreateFunction: function (c) {
      var n = c.getChildCount(), s = n < 10 ? 30 : n < 100 ? 36 : n < 1000 ? 44 : 52;
      return L.divIcon({ html: '<div class="cl" style="width:' + s + 'px;height:' + s + 'px">' + n + "</div>", className: "", iconSize: [s, s] });
    }
  }).addTo(map);

  function popupHtml(s) {
    var g = groupOf(s.업종), q = encodeURIComponent(s.이름 + " " + s.주소);
    var orig = s.원업태 && s.원업태 !== s.업종 ? " <span style=\"color:var(--muted)\">(신고 업태: " + esc(s.원업태) + ")</span>" : "";
    return '<div class="pp"><div class="pp-name">' + esc(s.이름) + "</div>" +
      '<div class="pp-tag"><span class="dot" style="background:var(--' + g + ')"></span>' + esc(s.업종) + orig + "</div>" +
      "<dl><dt>인허가일</dt><dd>" + esc(s.인허가일) + "</dd><dt>주소</dt><dd>" + esc(s.주소) + "</dd>" +
      "<dt>업종 근거</dt><dd>" + esc(s.업종근거) + "</dd></dl>" +
      '<div style="margin-top:8px;font-size:12.5px"><a href="https://map.naver.com/p/search/' + q + '" target="_blank" rel="noopener">네이버 지도에서 보기</a> · ' +
      '<a href="https://map.kakao.com/?q=' + q + '" target="_blank" rel="noopener">카카오맵</a></div></div>';
  }

  // ---- 자료 ----
  function loadRegion(code) {
    if (!cache[code]) cache[code] = fetch("data/map/" + code + ".json").then(function (r) { return r.json(); })
      .then(function (d) { return d.가게.map(function (s) { s._r = d.지역; return s; }); });
    return cache[code];
  }
  function codesFor(region) {
    if (region === "all") return index.지역.map(function (r) { return r.코드; });
    if (region.indexOf("sido-") === 0) { var sd = SIDO[region.slice(5)]; return index.지역.filter(function (r) { return r.시도 === sd; }).map(function (r) { return r.코드; }); }
    return [region];
  }
  function daysAgo(d) { var t = new Date(refDate); t.setDate(t.getDate() - d); return t.toISOString().slice(0, 10); }

  function load() {
    $("loading").hidden = false;
    return Promise.all(codesFor(state.region).map(loadRegion)).then(function (parts) {
      current = [].concat.apply([], parts);
      $("loading").hidden = true;
      render(true);
    }).catch(function () { $("loading").textContent = "자료를 불러오지 못했습니다. 새로고침해 주세요."; });
  }

  function inPeriod() { var from = daysAgo(state.days); return current.filter(function (s) { return s.인허가일 >= from; }); }

  function renderChips(rows) {
    var cnt = {};
    rows.forEach(function (s) { var g = groupOf(s.업종); cnt[g] = (cnt[g] || 0) + 1; });
    $("chips").innerHTML = GROUPS.map(function (g) {
      return '<button type="button" class="chip" id="chip-' + g.key + '" data-g="' + g.key + '" aria-pressed="' + (!state.off[g.key]) + '" title="' + esc(g.cats.join(", ")) + '">' +
        '<span class="dot" style="background:var(--' + g.key + ')"></span>' + esc(g.name) + ' <span class="n">' + (cnt[g.key] || 0).toLocaleString() + "</span></button>";
    }).join("");
  }

  var markers = [];
  function render(fit) {
    var rows = inPeriod();
    renderChips(rows);
    var shown = rows.filter(function (s) { return !state.off[groupOf(s.업종)] && s.위도; });
    cluster.clearLayers();
    markers = shown.map(function (s) {
      var m = L.marker([s.위도, s.경도], { icon: L.divIcon({ className: "", html: '<div class="shop-dot" style="background:var(--' + groupOf(s.업종) + ')"></div>', iconSize: [12, 12] }), title: s.이름 });
      m.bindPopup(function () { return popupHtml(s); }, { maxWidth: 300 });
      m._shop = s;
      return m;
    });
    cluster.addLayers(markers);
    var label = state.region === "all" ? "수도권" : state.region.indexOf("sido-") === 0 ? SIDO[state.region.slice(5)] : (index.지역.find(function (r) { return r.코드 === state.region; }) || {}).지역;
    $("total").textContent = shown.length.toLocaleString();
    $("total-sub").textContent = "곳 · " + label + "에서 " + ({ 14: "최근 2주", 30: "최근 1개월", 90: "최근 3개월" })[state.days] + " 새로 신고";
    if (fit && markers.length) {
      var b = L.latLngBounds(shown.map(function (s) { return [s.위도, s.경도]; }));
      map.fitBounds(b.pad(0.05), { maxZoom: 15 });
    }
    renderList();
  }

  function renderList() {
    var b = map.getBounds();
    var vis = markers.filter(function (m) { return b.contains(m.getLatLng()); }).map(function (m) { return m._shop; });
    vis.sort(function (a, c) { return a.인허가일 < c.인허가일 ? 1 : a.인허가일 > c.인허가일 ? -1 : 0; });
    var max = 100;
    $("list-count").textContent = vis.length > max ? vis.length.toLocaleString() + "곳 중 " + max + "곳" : vis.length.toLocaleString() + "곳";
    if (!vis.length) { $("list").innerHTML = '<li class="empty" style="display:block;cursor:default">이 화면에는 조건에 맞는 가게가 없습니다. 지도를 움직이거나 업종·기간을 바꿔 보세요.</li>'; return; }
    $("list").innerHTML = vis.slice(0, max).map(function (s, i) {
      return '<li tabindex="0" data-i="' + i + '"><span class="dot" style="background:var(--' + groupOf(s.업종) + ')"></span>' +
        '<span class="nm">' + esc(s.이름) + '</span><span class="dt">' + esc(s.인허가일.slice(5).replace("-", ".")) + "</span>" +
        '<span class="meta">' + esc(s.업종) + " · " + esc(s.주소) + "</span></li>";
    }).join("");
    $("list")._rows = vis.slice(0, max);
  }

  function openShop(s) {
    var m = markers.find(function (x) { return x._shop === s; });
    if (!m) return;
    cluster.zoomToShowLayer(m, function () { m.openPopup(); });
  }

  // ---- 조작 ----
  $("chips").addEventListener("click", function (e) {
    var b = e.target.closest(".chip"); if (!b) return;
    var g = b.getAttribute("data-g"); state.off[g] = !state.off[g]; render(false);
  });
  ["p14", "p30", "p90"].forEach(function (id) {
    $(id).addEventListener("click", function () {
      state.days = +this.getAttribute("data-days");
      ["p14", "p30", "p90"].forEach(function (x) { $(x).setAttribute("aria-pressed", x === id); });
      render(false);
    });
  });
  $("region").addEventListener("change", function () {
    state.region = this.value;
    try { location.hash = state.region === "all" ? "" : "r-" + state.region; } catch (e) {}
    load();
  });
  $("list").addEventListener("click", function (e) {
    var li = e.target.closest("li[data-i]"); if (li) openShop(this._rows[+li.getAttribute("data-i")]);
  });
  $("list").addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return; var li = e.target.closest("li[data-i]"); if (li) openShop(this._rows[+li.getAttribute("data-i")]);
  });
  var t; map.on("moveend", function () { clearTimeout(t); t = setTimeout(renderList, 120); });

  // ---- 시작 ----
  fetch("data/map/index.json").then(function (r) { return r.json(); }).then(function (d) {
    index = d; refDate = d.갱신일;
    $("updated").textContent = "영업 신고·허가 공공데이터 · 수도권 66개 시군구 · " + d.갱신일.replace(/-/g, ".") + " 갱신";
    var opts = ['<option value="all">수도권 전체</option>'];
    ["서울", "경기", "인천"].forEach(function (sd) {
      var rs = d.지역.filter(function (r) { return r.시도 === sd; }).sort(function (a, b) { return a.지역.localeCompare(b.지역, "ko"); });
      opts.push('<optgroup label="' + sd + '"><option value="sido-' + SIDO_KEY[sd] + '">' + sd + " 전체</option>" +
        rs.map(function (r) { return '<option value="' + r.코드 + '">' + esc(r.지역) + "</option>"; }).join("") + "</optgroup>");
    });
    $("region").innerHTML = opts.join("");
    var h = (location.hash || "").replace("#r-", "");
    if (h && ((/^sido-/.test(h) && SIDO[h.slice(5)]) || d.지역.some(function (r) { return r.코드 === h; }))) state.region = h;
    $("region").value = state.region;
    load();
  }).catch(function () { $("loading").textContent = "자료를 불러오지 못했습니다. 새로고침해 주세요."; });
})();
</script>
</body>
</html>
